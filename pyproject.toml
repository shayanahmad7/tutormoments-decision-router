[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tutormoments-decision-router"
version = "0.1.0"
description = "Reproducible TutorMoments structured-decision pilot"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tm_router = ["publisher_prompts/**/*.txt", "publisher_prompts/**/*.md"]
